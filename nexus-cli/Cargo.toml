[package]
# Published as "nexus-search-cli" (plain "nexus-cli" is already taken on
# crates.io by an unrelated project). The installed binary is still `nexus`
# (set explicitly below), unaffected by the package rename.
name = "nexus-search-cli"
# Patch bump over the workspace's 0.1.0: fixes the docs.rs build.
# v0.1.1 tried [package.metadata.docs.rs] cargo-args = ["--bins"], but
# docs.rs hardcodes `--lib` in its build invocation regardless of
# cargo-args, so that alone doesn't work for a crate with no [lib] target.
# v0.1.2 adds an actual (stub) [lib] target instead — see src/lib.rs.
version = "0.1.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI monitor and admin tool for Nexus search indexes"
keywords = ["cli", "search", "postgres", "admin", "bm25"]
categories = ["command-line-utilities", "database"]

[lib]
name = "nexus_search_cli"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
nexus-core = { path = "../nexus-core", package = "nexus-search-core", version = "0.1.0" }
nexus-postgres = { path = "../nexus-postgres", version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
