[package]
name = "nexus-dashboard"
# Patch bump over the workspace's 0.1.0: crates.io keyword/discoverability
# tuning only (no code change).
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP dashboard and REST API for Nexus search indexes (Axum)"
keywords = ["search", "dashboard", "axum", "rest", "pgvector"]
categories = ["web-programming::http-server"]

[features]
default = ["postgres"]
postgres = ["nexus-postgres"]

[dependencies]
nexus-core = { path = "../nexus-core", package = "nexus-search-core", version = "0.1.0" }
nexus-postgres = { path = "../nexus-postgres", optional = true, version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
