[package]
name = "nexus-postgres"
# Patch bump over the workspace's 0.1.0: crates.io keyword/discoverability
# tuning only (no code change). Also now depends on nexus-search-core 0.1.1.
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL backend for the Nexus search engine"
keywords = ["search", "postgres", "pgvector", "bm25", "rag"]
categories = ["database"]

[features]
default = []
pgvector = []  # enables pgvector HNSW ANN queries instead of brute-force float scan

[dependencies]
nexus-core = { path = "../nexus-core", package = "nexus-search-core", version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
lz4_flex = { workspace = true }
